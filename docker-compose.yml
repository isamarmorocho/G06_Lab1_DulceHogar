# PostgreSQL 17 para el laboratorio (opcional si ya lo instalaste en tu computadora)
# Levantar: docker compose up -d   ·   Detener: docker compose down
services:
  postgres:
    image: postgres:17-alpine
    container_name: lab2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: espe_user
      POSTGRES_PASSWORD: espe_password
      POSTGRES_DB: espe_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
