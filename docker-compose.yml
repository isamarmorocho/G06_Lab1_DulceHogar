# PostgreSQL 17 + MongoDB 8 para el laboratorio
# Levantar: docker compose up -d   ·   Detener: docker compose down
services:
  postgres:
    image: postgres:17-alpine
    container_name: lab2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: espe_user
      POSTGRES_PASSWORD: espe_password
      POSTGRES_DB: espe_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Laboratorio U2: servicio de MongoDB (usuario root → authSource=admin)
  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: espe_user
      MONGO_INITDB_ROOT_PASSWORD: espe_password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
